openapi: 3.0.3
info:
  title: Zambia Integrated Digital ID & Civil Registry (ZIDCR) API
  description: API documentation for the core microservices of the ZIDCR ecosystem.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Core Identity Service (Spring Boot)
  - url: http://localhost:8000/api/v1
    description: Biometric Processing Service (FastAPI)
  - url: http://localhost:8081/api/v1
    description: GSB Gateway Service (Middleware)

paths:
  /citizens/enroll:
    post:
      summary: Enroll a new citizen
      description: Creates a new citizen record, generates a UCI, and returns a Verifiable Credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '201':
          description: Citizen successfully enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '400':
          description: Invalid input

  /civil-registration/birth:
    post:
      summary: Register a birth
      description: Registers a birth and establishes lineage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirthRegistrationRequest'
      responses:
        '201':
          description: Birth registered successfully
          
  /civil-registration/death:
    post:
      summary: Register a death
      description: Registers a death, requires ICD-11 coding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeathRegistrationRequest'
      responses:
        '200':
          description: Death registered successfully

  /gsb/verify:
    post:
      summary: Verify citizen identity (GSB Gateway)
      description: External agencies (e.g., banks) use this to verify a citizen's KYC token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KYCVerificationRequest'
      responses:
        '200':
          description: KYC Success Token generated
          
components:
  schemas:
    EnrollmentRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
        biometricHash:
          type: string
          description: ISO/IEC 19794 compliant template hash
    EnrollmentResponse:
      type: object
      properties:
        uci:
          type: string
          format: uuid
        digitalGreenCard:
          type: string
          description: ECDSA P-256 signed Verifiable Credential
    BirthRegistrationRequest:
      type: object
      properties:
        childFirstName:
          type: string
        childLastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        motherUci:
          type: string
          format: uuid
        fatherUci:
          type: string
          format: uuid
        location:
          type: string
    DeathRegistrationRequest:
      type: object
      properties:
        citizenUci:
          type: string
          format: uuid
        dateOfDeath:
          type: string
          format: date
        icd11Code:
          type: string
          description: ICD-11 code for cause of death
        location:
          type: string
    KYCVerificationRequest:
      type: object
      properties:
        citizenUci:
          type: string
          format: uuid
        consentToken:
          type: string
          description: Token generated by Citizen Mobile Wallet
