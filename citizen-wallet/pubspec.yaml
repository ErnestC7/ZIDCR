name: citizen_wallet
description: ZIDCR Citizen Wallet and Field Registration App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # For rendering dynamic QR codes
  qr_flutter: ^4.1.0
  
  # For secure offline storage of the ID
  flutter_secure_storage: ^8.0.0
  
  # For regular preferences
  shared_preferences: ^2.2.1
  
  # For state management
  provider: ^6.0.5

  # For NFC physical card linking and offline transmission
  nfc_manager: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
